  <header>

      <font color="green">
        360
      </font>
      <font color="blue">

    <nav align="center">
      <a href="index.html">Home</a> |

      <a href="Patient-login.html">Patient Login</a>

    </nav>
  </header>
  <hr>
  <main>
    <form>
      <table align="center">
        <tr>
          <td>
            <h1>Doctor Registration Form</h1>
          </td>
        </tr>
        <tr>
          <td>
            <label>Name:</label>
          </td>
          <td><input type="text"></td>
        </tr><br>
        <tr>
          <td>
            <label>Password:</label>
          </td>
          <td><input type="Password"></td>
        </tr><br>
        <tr>
          <td>
            <label>Email:</label>
          </td>
          <td><input type="Email"></td>
        </tr><br>
        <tr>
          <td>
            <label>Phone Number:</label>
          </td>
          <td><input type="Phone Number"></td>
        </tr><br>
        <tr>
          <td><label>Specialization</label></td>
          <td>
            <select>
              <option value="Cardiologist">Cardiologist</option>
              <option value="Dermatologist">Dermatologist</option>
              <option value="Neurologist">Neurologist</option>
              <option value="General Physician">General Physician</option>
            </select>
          </td>

        </tr><br>
        <tr>
          <td>
            <label>Experince (Years):</label>
          </td>
          <td><input type="number"></td>
        </tr><br>

        <td>
          <label>Gender:</label>
        </td>
        <td>
          <input type="radio" value="Male">Male
          <input type="radio" value="Female">Female
        </td>
        </tr><br>
        <tr>
          <td>
            <label>Available Days:</label>
          </td>
          <td>
            <input type="checkbox" value="Monday">Monday
            <input type="checkbox" value="Tuesday">Tuesday
            <input type="checkbox" value="Wednesday">Wednesday
          </td>
        </tr><br>
        <tr>
          <td>
            <label>Available Time:</label>
          </td>
          <td><input type="time"></td>
        </tr><br>
        <tr>
          <td>Address:</td><br>
          <td><textarea rows="5" cols="30"></textarea></td>
        </tr><br>
        <tr>
          <td>
            <label>Upload Certificate:</label>
          </td>
          <td><input type="file"></td>
        </tr><br>
        <tr>
          <td>
            <input type="button" value="Register">
            <input type="button" value="clear">
          </td>

        </tr>

      </table>


    </form>
  </main>
