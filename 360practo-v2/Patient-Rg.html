  <main>
    
    <form name="patient reg" method="get">
     
      <table align="center">
        <caption>
          <td><h1 >Patient Registration Form</h1></td>
        </caption>
        <tr>
          <td>
            <label>Name:</label>
          </td>
          <td><input type="text"></td>
        </tr><br>
        <tr>
          <td>
            <label>Password:</label>
          </td>
          <td><input type="Password"></td>
        </tr><br>
        <tr>
          <td>
            <label>Email:</label>
          </td>
          <td><input type="Email"></td>
        </tr><br>
        <tr>
          <td>
            <label>Phone Number:</label>
          </td>
          <td><input type="Phone Number"></td>
        </tr><br>
        <tr>
          <td>
            <label>Date of Birth:</label>
          </td>
          <td><input type="Date"></td>
        </tr><br>
        <tr>
          <td>
            <label>Appointment Date and Time:</label>
          </td>
          <td><input type="datetime-local"></td>
        </tr><br>

        <td>
          <label>Gender:</label>
        </td>
        <td>
          <input type="radio" value="Male">Male
          <input type="radio" value="Female">Female
        </td>
        </tr><br>
        <tr>
          <td>
            <label>Diseases:</label>
          </td>
          <td>
            <input type="checkbox" value="Disable">Disable
            <input type="checkbox" value="BP">BP
            <input type="checkbox" value="Heart Problem">Heart Problem
          </td>
        </tr><br>
        <tr>
           <td><label>Blood Group:</label></td> 
           <td>
            <select type="Blood Group">
              <option value="A+">A+</option>
              <option value="B+">B+</option>
              <option value="O+">O+</option>
            </select>
           </td>
        
        </tr><br>
        <tr>
          <td>Address:</td><br>
          <td><textarea rows="5" cols="30"></textarea></td>
        </tr><br>
        <tr>
          <td>
            <label>Upload File:</label>
          </td>
          <td><input type="file"></td>
        </tr><br>
        <tr>
          <td>
            <input type="button" value="Register">
            <input type="button" value="clear">
          </td>
         
        </tr>

      </table>


    </form>
  </main>
