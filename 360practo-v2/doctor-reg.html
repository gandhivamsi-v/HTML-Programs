  <hr>
  <main>
    <form name="Registration form" method="get">
      <table align="center">
        
          <caption>
            <h1>Doctor Registration Form</h1>
          </caption>
          
        </tr>
        <tr>
          <td>
            <label for="id1">Name:</label>
          </td>
          <td><input type="text" id="id1" name="name1"></td>
        </tr><br>
        <tr>
          <td>
            <label for="id2">Password:</label>
          </td>
          <td><input type="Password"  id="id2" name="name2"></td>
        </tr><br>
        <tr>
          <td>
            <label for="id3">Email:</label>
          </td>
          <td><input type="Email" id="id3" name="name3"></td>
        </tr><br>
        <tr>
          <td>
            <label for="id4" >Phone Number:</label>
          </td>
          <td><input type="tel" id="id4" name="name4"></td>
        </tr><br>
        <tr>
          <td><label>Specialization</label></td>
          <td>
            <select>
              <option value="Cardiologist">Cardiologist</option>
              <option value="Dermatologist">Dermatologist</option>
              <option value="Neurologist">Neurologist</option>
              <option value="General Physician">General Physician</option>
            </select>
          </td>

        </tr><br>
        <tr>
          <td>
            <label for="id5">Experince (Years):</label>
          </td>
          <td><input type="number"  id="id5" name="name5"></td>
        </tr><br>

        <td>
          <label >Gender:</label>
        </td>
        <td>
          <input type="radio" value="Male" >Male
          <input type="radio" value="Female" >Female
        </td>
        </tr><br>
        <tr>
          <td>
            <label  >Available Days:</label>
          </td>
          <td>
            <input type="checkbox" value="Monday" >Monday
            <input type="checkbox" value="Tuesday" >Tuesday
            <input type="checkbox" value="Wednesday" >Wednesday
          </td>
        </tr><br>
        <tr>
          <td>
            <label for="id6" >Available Time:</label>
          </td>
          <td><input type="time" id="id6" name="name6"></td>
        </tr><br>
        <tr>
          <td><label for="id7" >Address:</label></td><br>
          <td><textarea rows="5" cols="30" id="id7" name="name7"></textarea></td>
        </tr><br>
        <tr>
          <td>
            <label for="id8">Upload Certificate:</label>
          </td>
          <td><input type="file"  id="id8" name="name8"></td>
        </tr><br>
        <tr>
          <td>
            <input type="submit" value="Register">
            <input type="reset" value="clear">
          </td>

        </tr>

      </table>


    </form>
  </main>
